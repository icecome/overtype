name: Sync npm-release

on:
  push:
    branches: [overtypeplus]
    paths:
      - 'packages/core/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Flatten packages/core to npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync npm-release branch
        run: bash .github/scripts/sync-npm-release.sh
